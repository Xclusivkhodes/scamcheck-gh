name: Web

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "e2e/**"
      - "evals/**"
      - "public/**"
      - "design/**"
      - "proxy.ts"
      - "instrumentation.ts"
      - "next.config.ts"
      - "Dockerfile"
      - "render.yaml"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      RATE_LIMIT_PER_MINUTE: "1000"
      RATE_LIMIT_PER_DAY: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run eval
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
