name: Android debug APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The action's default package list includes the retired "tools" package,
      # which makes sdkmanager exit 1. Name the packages the build needs instead.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test the on-device classifier and build the debug APK
        working-directory: android
        run: gradle :classifier:test :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: scamcheck-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
